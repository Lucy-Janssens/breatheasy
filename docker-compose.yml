services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: ghcr.io/lucy-janssens/breatheasy-api:latest
    container_name: breatheasy-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - /sys:/sys:ro
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/i2c-1:/dev/i2c-1
    privileged: true
    environment:
      - DATABASE_URL=sqlite:///./data/breatheasy.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MQTT_BROKER_HOST=mqtt
      - MQTT_BROKER_PORT=1883
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - mqtt

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: ghcr.io/lucy-janssens/breatheasy-client:latest
    container_name: breatheasy-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  mqtt:
    image: eclipse-mosquitto:2
    container_name: breatheasy-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    ports:
      - "0.0.0.0:8123:8123"
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    privileged: true
    depends_on:
      - mqtt

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: breatheasy-api breatheasy-client
